<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRIVE CITY</title>
<link rel="icon" type="image/png" href="DRIVECITY.png">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#1d2127;--ink:#f3ead8;--taxi:#f2c230;--nile:#2a9d8f;--red:#e5484d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:relative;width:100%;height:100%}
canvas{display:block}
#c,#c3{position:absolute;inset:0}
#hud{position:absolute;top:10px;inset-inline:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-weight:800}
#money{font-size:22px;color:var(--taxi)}
#stars{font-size:22px;color:var(--red);letter-spacing:2px;min-height:30px}
.bar{width:120px;height:10px;background:#0006;border-radius:5px;overflow:hidden;margin-top:6px}
#hp{height:100%;width:100%;background:var(--nile);transition:width .15s}
#ctl{position:absolute;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;padding:0 14px;direction:ltr}
@media (pointer:coarse){#ctl{display:flex}}
.grp{display:flex;gap:10px}
button{font-family:inherit}
.pad{width:72px;height:72px;border-radius:50%;border:2px solid #fff3;background:#0007;color:var(--ink);font-size:26px;touch-action:none}
.pad.on{background:var(--taxi);color:#222}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;background:#14171bee;text-align:center;padding:24px;overflow-y:auto;touch-action:pan-y}
#ov h1{margin:0;font-size:38px;font-weight:800}
#ov p{margin:0;max-width:34ch;line-height:1.7;opacity:.85}
#set{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;width:min(100%,420px);text-align:start}
#set[hidden]{display:none}
#set.lite{grid-template-columns:1fr}
#set.lite label:not(.keep){display:none}
#ov.paused #lb,#ov.paused #best,#ov.paused #sb{display:none}
#btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#sb{padding:12px 22px;border-radius:10px;border:2px solid #fff4;background:transparent;color:var(--ink);font-size:18px;font-weight:800}
#sb:focus-visible{outline:3px solid var(--nile);outline-offset:3px}
#eb{padding:12px 22px;border-radius:10px;border:2px solid var(--red);background:transparent;color:var(--red);font-size:18px;font-weight:800}
#eb[hidden]{display:none}
#eb:focus-visible{outline:3px solid var(--nile);outline-offset:3px}
#set label{display:flex;flex-direction:column;gap:4px;font-size:14px}
#set select,#set input{width:100%;box-sizing:border-box;font-family:inherit;background:#242a32;color:var(--ink);border:1px solid #fff3;border-radius:8px;padding:6px}
#set input[type=range]{padding:0;accent-color:var(--taxi)}
#set input[type=color]{height:36px;padding:2px}
#best{font-weight:800;color:var(--taxi)}
#gear{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;border:2px solid #fff3;background:#0007;color:var(--ink);font-size:22px;line-height:1;padding:0;touch-action:manipulation}
#gear:focus-visible{outline:3px solid var(--nile);outline-offset:2px}
#lb{width:min(100%,420px);box-sizing:border-box;background:#0004;border-radius:10px;padding:8px 12px;font-size:14px;text-align:start}
#lb .h{font-weight:800;margin-bottom:4px}
#lb .row{display:flex;justify-content:space-between;padding:2px 0}
#lb .me{color:var(--nile)}
#go{padding:12px 34px;border-radius:10px;border:0;background:var(--taxi);color:#222;font-size:20px;font-weight:800}
#go:focus-visible{outline:3px solid var(--nile);outline-offset:3px}
#money{display:inline-block;transform-origin:right center}
#hp{transition:width .15s,background .3s}
button{transition:transform .12s,background .2s,color .2s}
#gear{transition:transform .3s}
#hit{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 20px #e5484d;opacity:0}
.flt{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-weight:800;font-size:30px;color:var(--taxi);pointer-events:none;text-shadow:0 2px 8px #000a}
.pad.on{transform:scale(.92)}
@media (max-width:430px){.pad{width:60px;height:60px}}
#go:active,#sb:active,#eb:active{transform:scale(.95)}
@media (hover:hover){#go:hover,#sb:hover,#eb:hover{transform:scale(1.05)}#gear:hover{transform:translateX(-50%) rotate(90deg)}}
@media (prefers-reduced-motion:no-preference){
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes glow{50%{text-shadow:0 0 18px #f2c23088}}
@keyframes mpop{40%{transform:scale(1.35)}}
@keyframes pls{50%{opacity:.55;transform:scale(1.12)}}
@keyframes hit{from{opacity:.85}to{opacity:0}}
@keyframes flt{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
#ov>*{animation:pop .45s both}
#ov>*:nth-child(2){animation-delay:.06s}
#ov>*:nth-child(3){animation-delay:.12s}
#ov>*:nth-child(4){animation-delay:.18s}
#ov>*:nth-child(5){animation-delay:.24s}
#ov h1{animation:pop .45s both,glow 3s .5s infinite}
#money.pop{animation:mpop .4s}
#stars{animation:pls 1s infinite}
#hit.on{animation:hit .4s}
.flt{animation:flt 1.2s ease-out forwards}
}
</style>
</head>
<body>
<div id="stage">
<canvas id="c"></canvas>
<div id="hud"><div><div id="money">0 جنيه</div><div class="bar"><div id="hp"></div></div></div><div id="stars"></div></div>
<div id="ctl">
<div class="grp"><button class="pad" data-k="l" aria-label="يسار">◀</button><button class="pad" data-k="r" aria-label="يمين">▶</button></div>
<div class="grp"><button class="pad" data-k="h" aria-label="تخميس" style="font-size:15px">تخميس</button><button class="pad" data-k="d" aria-label="فرامل">▼</button><button class="pad" data-k="u" aria-label="بنزين">▲</button></div>
</div>
<div id="hit"></div>
<button id="gear" aria-label="الإعدادات">⚙</button>
<div id="ov"><h1 id="t1">مشوار المدينة</h1><p id="t2">وصّل الطلبات للدوائر الخضراء واكسب فلوس. خد بالك من المشاة، لو خبطت حد البوليس هيطاردك. الأسهم أو WASD للسواقة، والمسافة أو زر تخميس عشان تخمّس.</p><div id="best"></div><div id="lb"></div>
<div id="btns"><button id="go">ابدأ السواقة</button><button id="sb">⚙ الإعدادات</button><button id="eb" hidden>إنهاء اللعبة</button></div>
<div id="set" hidden>
<label class="keep">الصوت <input type="range" id="sVol" min="0" max="100"></label>
<label class="keep">حساسية الدريكسيون <input type="range" id="sSens" min="5" max="15"></label>
<label>الصعوبة <select id="sDiff"><option value="0.6">سهل</option><option value="1">عادي</option><option value="1.5">صعب</option></select></label>
<label>الوقت <select id="sTime"><option value="auto">تلقائي</option><option value="day">نهار</option><option value="dusk">غروب</option><option value="night">ليل</option></select></label>
<label>الجو <select id="sWx"><option value="clear">صافي</option><option value="rain">مطر</option><option value="fog">شبورة</option></select></label>
<label>لون العربية <input type="color" id="sCol"></label>
<label>اسمك في الترتيب <input type="text" id="sName" maxlength="14" placeholder="لاعب"></label>
</div>
</div>
</div>
<script>
const C=document.getElementById('c'),g=C.getContext('2d');
let W,H,sc=1;var R3=null,scn,cam,amb,sun,hl,pcar,missM,camA=0,wm=[],bulbM,cm=[],pm=[],sync3d,puff=null,dmark=null,ST=0,shake=0,fr=0,lastM=0,lastHp=100;
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;C.width=W*d;C.height=H*d;C.style.width=W+'px';C.style.height=H+'px';sc=W<600?0.75:1;g.setTransform(d*sc,0,0,d*sc,0,0);if(R3){R3.setPixelRatio(Math.min(d,2));R3.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix()}}
addEventListener('resize',rs);rs();
const CELL=400,N=12,SZ=CELL*N;
const rnd=(a,b)=>a+Math.random()*(b-a);
function hash(i,j){let h=(i*374761393+j*668265263)^(i*j*1274126177);h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967295}
function solid(x,y){const lx=((x%CELL)+CELL)%CELL,ly=((y%CELL)+CELL)%CELL;return lx>140&&lx<380&&ly>140&&ly<380}
function blocked(x,y,a){const c=Math.cos(a),s=Math.sin(a);for(const[u,v]of[[17,8],[17,-8],[-17,8],[-17,-8]])if(solid(x+c*u-s*v,y+s*u+c*v))return true;return false}
function move(o,dt){const md=o.a-(o.sl||0),nx=o.x+Math.cos(md)*o.v*dt,ny=o.y+Math.sin(md)*o.v*dt;if(blocked(nx,ny,o.a)){const i=Math.abs(o.v);o.v*=-0.3;return i}o.x=nx;o.y=ny;return 0}
const K={},T={};
addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='Space'&&e.target.tagName!=='INPUT')e.preventDefault();if(e.code==='Enter'&&state!=='play'){state==='pause'?resume():start()}if((e.code==='Escape'||e.code==='KeyP')&&e.target.tagName!=='INPUT'){if(state==='play')pauseGame();else if(state==='pause')resume()}});
addEventListener('keyup',e=>{K[e.code]=0;if(e.code==='Space'&&e.target.tagName!=='INPUT')e.preventDefault()});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
const on=e=>{e.preventDefault();T[k]=1;b.classList.add('on')},off=()=>{T[k]=0;b.classList.remove('on')};
b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off))});
let state='menu',P,cops,peds,mission,money,hp,heat,t=0;
const $=id=>document.getElementById(id);
function pt(r0,r1){for(let k=0;k<40;k++){const a=rnd(0,6.283),d=rnd(r0,r1),x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;if(!solid(x,y)&&!solid(x+22,y)&&!solid(x-22,y)&&!solid(x,y+22)&&!solid(x,y-22))return[x,y]}return null}
function newMission(){const p=pt(300,2400);mission=p?{x:p[0],y:p[1]}:{x:P.x+600,y:P.y};mission.r=Math.round((150+Math.hypot(mission.x-P.x,mission.y-P.y)*.5)/10)*10}
function spawnPed(r0,r1){const p=pt(r0,r1);if(p)peds.push({x:p[0],y:p[1],a:rnd(0,6.28),dead:0,c:['#e8d5b0','#c7a27c','#9bc4cb','#d98d8d'][Math.random()*4|0]})}
function start(){P={x:CELL*6+60,y:CELL*6+60,a:0,v:0};cops=[];peds=[];money=0;hp=100;heat=0;for(let i=0;i<45;i++)spawnPed(80,900);newMission();state='play';$('ov').style.display='none';initAudio();last=performance.now()}
$('go').onclick=()=>{state==='pause'?resume():start()};
$('gear').onclick=pauseGame;
$('eb').onclick=endGame;
function endGame(){if(state!=='pause')return;state='over';const nb=submitScore();$('eb').hidden=true;lite(0);$('t1').textContent='انتهت اللعبة';$('t2').textContent='كسبت '+money+' جنيه.'+(nb&&money>0?' رقم قياسي جديد!':' جرّب تاني.');$('go').textContent='ابدأ من الأول';audioTick()}
$('sb').onclick=()=>{const s=$('set');s.hidden=!s.hidden;$('sb').textContent=s.hidden?'⚙ الإعدادات':'إخفاء الإعدادات'};
function pauseGame(){if(state!=='play')return;state='pause';if(document.activeElement)document.activeElement.blur();$('t1').textContent='الإعدادات';$('t2').textContent='اللعبة واقفة. غيّر اللي تحبه وكمّل.';$('go').textContent='كمّل';$('eb').hidden=false;$('set').hidden=false;lite(1);$('sb').textContent='إخفاء الإعدادات';$('ov').style.display='flex';audioTick()}
function floatText(x){const d=document.createElement('div');d.className='flt';d.textContent=x;$('stage').appendChild(d);setTimeout(()=>d.remove(),1250)}
function lite(on){$('set').classList.toggle('lite',!!on);$('ov').classList.toggle('paused',!!on);if(!on){$('set').hidden=true;$('sb').textContent='⚙ الإعدادات'}}
function resume(){state='play';lite(0);if(document.activeElement)document.activeElement.blur();$('eb').hidden=true;$('ov').style.display='none';last=performance.now()}
const S=Object.assign({vol:60,sens:10,diff:1,time:'auto',wx:'clear',col:'#f2c230',name:''},(()=>{try{return JSON.parse(localStorage.getItem('mc')||'{}')}catch(e){return{}}})());
const sv=()=>{try{localStorage.setItem('mc',JSON.stringify(S))}catch(e){}};
[['sVol','vol',1],['sSens','sens',1],['sDiff','diff',1],['sTime','time',0],['sWx','wx',0],['sCol','col',0],['sName','name',0]].forEach(([id,k,n])=>{const el=$(id);el.value=S[k];el.oninput=el.onchange=()=>{S[k]=n?+el.value:el.value;sv();if(k==='vol')setVol()}});
const ld=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}};
const sd=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let best=ld('mcb',0),loc=ld('mcl',[]),DB=null,UID=null,gb=[];
function renderLB(){
 const el=$('lb');el.textContent='';
 const rows=DB?gb.map(r=>[String(r.name||'لاعب').slice(0,14),+r.score||0,r.id===UID]):loc.map((s,i)=>['محاولة '+(i+1),s,false]);
 const h=document.createElement('div');h.className='h';h.textContent=DB?'أفضل اللاعبين':'أفضل نتايجك';el.appendChild(h);
 if(!rows.length){const e=document.createElement('div');e.textContent='لسه مفيش نتايج';el.appendChild(e)}
 rows.forEach((r,i)=>{const d=document.createElement('div');d.className='row'+(r[2]?' me':'');const a=document.createElement('span'),b=document.createElement('b');a.textContent=(i+1)+'. '+r[0];b.textContent=r[1]+' جنيه';d.append(a,b);el.appendChild(d)});
 $('best').textContent='أعلى رقم ليك: '+best+' جنيه';
}
function submitScore(){
 const nb=money>best;if(nb){best=money;sd('mcb',best)}
 if(money>0){loc.push(money);loc.sort((a,b)=>b-a);loc=loc.slice(0,5);sd('mcl',loc)}
 if(DB&&UID&&money>0){const ref=DB.collection('scores').doc(UID);ref.get().then(s=>{if(s.exists&&(+s.data().score||0)>=money)return;return ref.set({name:(S.name||'لاعب').slice(0,14),score:money,ts:Date.now()})}).catch(()=>{})}
 renderLB();return nb;
}
(async()=>{try{
 if(!window.claude||!claude.use)return;
 const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
 if(!d||!u)return;
 UID=await u.id();DB=d;
 DB.collection('scores').orderBy('score','desc').limit(10).onSnapshot(s=>{gb=s.docs.map(x=>({id:x.id,...x.data()}));renderLB()},()=>{DB=null;renderLB()});
}catch(e){DB=null}})();
renderLB();
let AC,mg,eo,eg,sir,sg,rg,sq;
function setVol(){if(mg)mg.gain.value=S.vol/100}
function initAudio(){
 if(AC){AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 mg=AC.createGain();mg.connect(AC.destination);setVol();
 eo=AC.createOscillator();eo.type='sawtooth';eg=AC.createGain();eg.gain.value=0;
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
 eo.connect(lp);lp.connect(eg);eg.connect(mg);eo.start();
 sir=AC.createOscillator();sir.type='square';sg=AC.createGain();sg.gain.value=0;sir.connect(sg);sg.connect(mg);sir.start();
 const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const ns=AC.createBufferSource();ns.buffer=b;ns.loop=true;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1500;rg=AC.createGain();rg.gain.value=0;ns.connect(hp);hp.connect(rg);rg.connect(mg);const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=2;sq=AC.createGain();sq.gain.value=0;ns.connect(bp);bp.connect(sq);sq.connect(mg);ns.start();
}
function beep(f,d,ty,v){if(!AC)return;const o=AC.createOscillator(),gn=AC.createGain();o.type=ty||'sine';o.frequency.value=f;gn.gain.setValueAtTime(v||.3,AC.currentTime);gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(gn);gn.connect(mg);o.start();o.stop(AC.currentTime+d)}
function audioTick(){if(!AC)return;const sp=Math.abs(P.v),pl=state==='play';eo.frequency.value=40+sp*0.35;eg.gain.value=pl?0.12+Math.min(.1,sp/3000):0;sg.gain.value=pl&&stars()?0.03:0;sir.frequency.value=Math.floor(t*2)%2?660:880;rg.gain.value=pl&&S.wx==='rain'?0.08:0;sq.gain.value=pl&&Math.abs(P.sl||0)>.12?.1:0}
const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
function shade(d){return d<=.45?mix([255,255,255],[240,168,120],d/.45):mix([240,168,120],[28,36,72],(d-.45)/.45)}
function dark(){return S.time==='day'?0:S.time==='dusk'?.45:S.time==='night'?.9:.45-.45*Math.cos(t/45)}
function atmos(vw,vh,cx,cy){
 const dk=dark(),w=performance.now()/1000;
 if(dk>0.02&&!R3){
  g.globalCompositeOperation='multiply';g.fillStyle='rgb('+shade(dk)+')';g.fillRect(0,0,vw,vh);
  if(dk>.3){
   const k=Math.min(1,(dk-.3)/.4);g.globalCompositeOperation='lighter';g.save();g.globalAlpha=k;
   const i0=Math.floor(cx/CELL),i1=Math.floor((cx+vw)/CELL),j0=Math.floor(cy/CELL),j1=Math.floor((cy+vh)/CELL);
   for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++)for(const[ox,oy]of[[130,130],[390,130],[130,390],[390,390]]){const lx=i*CELL+ox-cx,ly=j*CELL+oy-cy,gr=g.createRadialGradient(lx,ly,2,lx,ly,95);gr.addColorStop(0,'rgba(255,205,130,.55)');gr.addColorStop(1,'rgba(255,205,130,0)');g.fillStyle=gr;g.fillRect(lx-95,ly-95,190,190)}
   g.translate(vw/2,vh/2);g.rotate(P.a);const lg=g.createLinearGradient(18,0,280,0);lg.addColorStop(0,'rgba(255,240,190,.6)');lg.addColorStop(1,'rgba(255,240,190,0)');g.fillStyle=lg;g.beginPath();g.moveTo(18,-7);g.lineTo(280,-100);g.lineTo(280,100);g.lineTo(18,7);g.fill();
   g.restore();
  }
  g.globalCompositeOperation='source-over';
 }
 if(S.wx==='rain'){g.fillStyle='rgba(25,35,55,.18)';g.fillRect(0,0,vw,vh);g.strokeStyle='rgba(200,220,255,.45)';g.lineWidth=1.2;g.beginPath();for(let k=0;k<130;k++){const x=(k*97.3+w*70)%vw,y=(k*53.7+w*750)%vh;g.moveTo(x,y);g.lineTo(x-4,y+14)}g.stroke()}
 if(S.wx==='fog'&&!R3){const f=1-dk*.5,gr=g.createRadialGradient(vw/2,vh/2,60,vw/2,vh/2,Math.max(vw,vh)*.55);gr.addColorStop(0,'rgba(165,175,185,'+.12*f+')');gr.addColorStop(1,'rgba(165,175,185,'+.85*f+')');g.fillStyle=gr;g.fillRect(0,0,vw,vh)}
}
function stars(){return Math.ceil(heat-1e-6)}
function update(dt){
 t+=dt;
 const thr=((K.ArrowUp||K.KeyW||T.u)?1:0)-((K.ArrowDown||K.KeyS||T.d)?1:0);
 const st=((K.ArrowRight||K.KeyD||T.r)?1:0)-((K.ArrowLeft||K.KeyA||T.l)?1:0);
 ST=st;P.v+=thr*(thr>0?400:300)*dt;P.v-=P.v*1.1*dt;
 const dr=!!((K.Space||T.h)&&P.v>110&&st!==0);P.dr=dr;
 P.a+=st*2.6*(S.sens/10)*(S.wx==='rain'?0.85:1)*(dr?1.5:1)*dt*Math.max(-1,Math.min(1,P.v/110));
